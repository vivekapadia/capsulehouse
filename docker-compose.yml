version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: capsulehouse_db
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: capsulehouse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: capsulehouse_backend
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_USER: ${DB_USER:-myuser}
      DB_PASSWORD: ${DB_PASSWORD:-mypassword}
      DB_NAME: ${DB_NAME:-capsulehouse}
      DB_PORT: ${DB_PORT:-5432}
      PORT: ${PORT:-8080}
    ports:
      - "8080:8080"
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: capsulehouse_frontend
    environment:
      - NODE_ENV=production
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: capsulehouse_tunnel
    command: tunnel --url http://frontend:3000
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
